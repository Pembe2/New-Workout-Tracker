name: One-time workout plan patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-workout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch workout plan and migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("strength-circuit-2-day.html")
          text = path.read_text(encoding="utf-8")

          old_leg_curl = '        {name:"Circuit 4 - Leg Curl", sets:3, reps:"12-15", rest:"30s", cue:"2-3 rounds; control the eccentric."},'
          new_overhead_press = '        {name:"Circuit 4 - Neutral-Grip Dumbbell Overhead Press", sets:3, reps:"8-12", rest:"30-45s", cue:"2-3 rounds; keep ribs down, use a neutral grip, and press without shrugging."},'
          leg_count = text.count(old_leg_curl)
          if leg_count != 2:
              raise SystemExit(f"Expected 2 leg-curl definitions, found {leg_count}")
          # Day 1 (A) is the first occurrence. Day 3 is intentionally left alone until C is finalized.
          text = text.replace(old_leg_curl, new_overhead_press, 1)

          old_reverse_fly = '        {name:"Circuit 4 - Reverse Fly", sets:3, reps:"12-15", rest:"30s", cue:"2-3 rounds; lead with elbows and avoid shrugging.", options:["Machine","Cable"]},'
          new_reverse_fly = '        {name:"Circuit 4 - Dumbbell Reverse Fly", sets:3, reps:"12-15", rest:"30s", cue:"2-3 rounds; hinge slightly, lead with the elbows, and avoid shrugging."},'
          reverse_count = text.count(old_reverse_fly)
          if reverse_count != 2:
              raise SystemExit(f"Expected 2 reverse-fly definitions, found {reverse_count}")
          text = text.replace(old_reverse_fly, new_reverse_fly)

          legacy_anchor = '  const LEGACY_LIFT_NAME_MAP = {\n'
          migration_lines = (
              '    "Circuit 4 - Reverse Fly::Machine": "Circuit 4 - Dumbbell Reverse Fly",\n'
              '    "Circuit 4 - Reverse Fly::Cable": "Circuit 4 - Dumbbell Reverse Fly",\n'
              '    "Circuit 4 - Reverse Fly": "Circuit 4 - Dumbbell Reverse Fly",\n'
          )
          if migration_lines not in text:
              if legacy_anchor not in text:
                  raise SystemExit("Could not find legacy lift-name migration map")
              text = text.replace(legacy_anchor, legacy_anchor + migration_lines, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit workout changes
        shell: bash
        run: |
          rm -f .github/workflows/one-time-workout-plan-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strength-circuit-2-day.html .github/workflows/one-time-workout-plan-patch.yml
          git commit -m "Update circuit exercises and preserve reverse fly history"
          git push

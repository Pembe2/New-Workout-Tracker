name: One-time C and D workout update

on:
  push:
    paths:
      - '.github/trigger-days-cd.txt'

permissions:
  contents: write

jobs:
  patch-workout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply C and D workout plan
        run: python .github/scripts/patch-days-cd.py

      - name: Commit workout update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strength-circuit-2-day.html
          if git diff --cached --quiet; then
            echo "Workout plan already up to date."
            exit 0
          fi
          git commit -m "Add Days C and D to strength circuit"
          git push

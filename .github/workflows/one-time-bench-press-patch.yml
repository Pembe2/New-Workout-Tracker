name: One-time Day A bench press patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-workout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Day A Circuit 2
        run: python .github/scripts/patch-day-a-bench.py

      - name: Commit workout change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strength-circuit-2-day.html
          git commit -m "Swap Day A machine chest press for bench press"
          git push

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>5-Minute Ab Workout</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">

</head>
<body>
<div class="safe-area-fix"></div>

<header>
  <div class="wrap">
    <div class="head">
      <div>
        <h1>5-Minute Ab Workout</h1>
        <div class="sub">Fast core burner you can do anywhere. Saves on-device.</div>
      </div>
      <div class="row" style="position:relative">
        <button class="btn menuBtn iconOnly" id="menuToggle" aria-label="Menu">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M3 6h18M3 12h18M3 18h18"/>
          </svg>
        </button>
        <input type="file" id="importFile" style="display:none" accept=".json">
      </div>
    </div>
  </div>
</header>

<div class="menuLayer" id="menuLayer">
  <div class="menuOverlay" id="menuOverlay"></div>
  <div class="menuPopup" id="menuPopup">
    <a class="menuItem" href="index.html">Workout Index</a>
    <div class="hr" style="margin:4px 0"></div>
    <button class="menuItem" id="devNotesBtn">
      <img class="icon devNotesIcon devNotesIcon--dark" src="middle finger - white.svg" alt="">
      <img class="icon devNotesIcon devNotesIcon--light" src="middle finger -black.svg" alt="">
      Dev Notes
    </button>
    <button class="menuItem" id="themeToggle">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8z"/>
      </svg>
      Theme
    </button>
    <button class="menuItem" id="importBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12M8 11l4 4 4-4M4 21h16"/>
      </svg>
      Import
    </button>
    <button class="menuItem" id="exportBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21V9M8 13l4-4 4 4M4 3h16"/>
      </svg>
      Export
    </button>
    <button class="menuItem bad" id="resetBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6"/>
        <path d="M3 4v4h4"/>
      </svg>
      Reset
    </button>
  </div>
</div>

<main id="app"></main>

<div class="devNotesOverlay hidden" id="devNotesOverlay"></div>
<div class="devNotesModal hidden" id="devNotesModal" role="dialog" aria-modal="true" aria-labelledby="devNotesTitle">
  <div class="row" style="justify-content:space-between; align-items:center">
    <h3 id="devNotesTitle" style="margin:0">Developer Comments</h3>
    <button class="btn" id="devNotesClose" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
      Close
    </button>
  </div>
  <div class="devNotesList" id="devNotesList"></div>
  <div class="small" style="margin-bottom:6px">Add a comment</div>
  <textarea id="devNotesInput" style="width:100%; height:80px; padding:10px; border-radius:12px; border:1px solid var(--line); background:var(--input-bg); color:var(--text); font-family:var(--sans); font-size:13px;" placeholder="Type a comment..."></textarea>
  <div class="row" style="justify-content:flex-end; margin-top:8px">
    <button class="btn good" id="devNotesAdd" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Add
    </button>
  </div>
</div>

<script>
(() => {
  const KEY = "workout_tracker_ab_5_min_v1";
  const ICONS = {
    add: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
    remove: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>`,
    copy: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="10" height="10" rx="2"/><rect x="5" y="5" width="10" height="10" rx="2"/></svg>`,
    play: `<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l12 7-12 7z"/></svg>`,
    pause: `<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>`,
    reset: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6"/><path d="M3 4v4h4"/></svg>`,
    clock: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`,
    sound: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M16 9a5 5 0 0 1 0 6"/></svg>`,
    minus: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>`,
    plus: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>`,
    close: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`,
    check: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>`,
    unlock: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0"/></svg>`,
    trash: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>`,
    chevron: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>`
  };

  // 5-Minute Ab Workout plan

  const PLAN = [
  {
    id:"abs", short:"Abs", title:"5-Minute Ab Circuit",
    mobility:[],
    lifts:[
      {name:"Flutter Kicks", sets:1, reps:"45s", rest:"15s", cue:"Low back stays flat; small fast kicks."},
      {name:"Plank", sets:1, reps:"45s", rest:"15s", cue:"Ribs down; squeeze glutes."},
      {name:"Ab Wheel (or Hollow Hold)", sets:1, reps:"45s", rest:"15s", cue:"Stay braced; avoid arching."},
      {name:"Dead Bug", sets:1, reps:"45s", rest:"15s", cue:"Low back glued to floor."},
      {name:"Russian Twist", sets:1, reps:"45s", rest:"15s", cue:"Rotate from ribs; keep chest lifted.", options:["Bodyweight","Light Weight"]}
    ],
    conditioning:{label:"Timer", rx:"One 5-minute round: 45s on / 15s transition per move. Repeat if time allows."}
  }
];

  const $ = (s, el=document) => el.querySelector(s);

  function isoDate(d=new Date()){ return d.toISOString().slice(0,10); }
  function weekStartKey(d=new Date()){
    const x = new Date(d);
    const day = (x.getDay()+6)%7; // Mon=0
    x.setDate(x.getDate()-day);
    return isoDate(x);
  }
  function weekStartKeyWithCutoff(d=new Date()){
    const x = new Date(d);
    if(x.getDay() === 0 && x.getHours() >= 23){
      return weekStartKey(addDays(x, 1));
    }
    return weekStartKey(x);
  }
  function addDays(d, n){
    const x = new Date(d);
    x.setDate(x.getDate() + n);
    return x;
  }
  function nextSundayAt23(d=new Date()){
    const x = new Date(d);
    const day = x.getDay(); // Sun=0
    let daysUntil = (7 - day) % 7;
    if(day === 0 && x.getHours() >= 23) daysUntil = 7;
    const target = addDays(x, daysUntil);
    target.setHours(23, 0, 0, 0);
    return target;
  }

  function load(){
    try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; }
  }
  function save(state){
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  function defaultState(){
    return {
      weekStart: weekStartKeyWithCutoff(),
      activeDayId: PLAN[0].id,
      sessions: {}, // weekStart -> dayId -> data
      viewWeekStart: null,
      timers: {
        restDuration: 90,
        restRemaining: 90,
        workoutElapsed: 0,
        theme: "dark",
        interval: {
          dayId: PLAN[0].id,
          index: 0,
          phase: "work",
          remaining: 0,
          running: false
        }
      }
    };
  }

  let state = load() || defaultState();
  const openLifts = new Set();
  const timers = {
    rest:{duration:90, remaining:90, running:false, interval:null},
    workout:{elapsed:0, running:false, interval:null}
  };
  const intervalTimer = {
    dayId: PLAN[0].id,
    index: 0,
    phase: "work",
    remaining: 0,
    running: false,
    interval: null
  };
  let intervalItems = [];
  let weeklyRolloverTimer = null;

  // Apply theme immediately
  if(!state.theme) state.theme = "dark";
  if(state.theme === "light") document.body.classList.add("light");
  else document.body.classList.remove("light");

  function ensureWeek(){
    const wk = weekStartKeyWithCutoff();
    if(state.weekStart !== wk){
      const oldWeek = state.weekStart;
      state.weekStart = wk;
      state.activeDayId = PLAN[0].id;
      if(!state.viewWeekStart || state.viewWeekStart === oldWeek){
        state.viewWeekStart = wk;
      }
    }
    if(!state.sessions[state.weekStart]) state.sessions[state.weekStart] = {};
    if(!state.viewWeekStart) state.viewWeekStart = state.weekStart;
  }

  function scheduleWeeklyRollover(){
    if(weeklyRolloverTimer){
      clearTimeout(weeklyRolloverTimer);
      weeklyRolloverTimer = null;
    }
    const now = new Date();
    const target = nextSundayAt23(now);
    const ms = Math.max(1000, target.getTime() - now.getTime());
    weeklyRolloverTimer = setTimeout(() => {
      ensureWeek();
      state.viewWeekStart = state.weekStart;
      save(state);
      render();
      scheduleWeeklyRollover();
    }, ms);
  }

  function ensureTimers(){
    if(!state.timers) state.timers = {restDuration:90, restRemaining:90, workoutElapsed:0, interval:{}};
    if(!Number.isFinite(state.timers.restDuration)) state.timers.restDuration = 90;
    if(!Number.isFinite(state.timers.restRemaining)) state.timers.restRemaining = state.timers.restDuration;
    if(!Number.isFinite(state.timers.workoutElapsed)) state.timers.workoutElapsed = 0;
    timers.rest.duration = state.timers.restDuration;
    timers.rest.remaining = state.timers.restRemaining;
    timers.workout.elapsed = state.timers.workoutElapsed;
  }

  function persistTimers(){
    state.timers = {
      restDuration: timers.rest.duration,
      restRemaining: timers.rest.remaining,
      workoutElapsed: timers.workout.elapsed,
      interval: {
        dayId: intervalTimer.dayId,
        index: intervalTimer.index,
        phase: intervalTimer.phase,
        remaining: intervalTimer.remaining,
        running: false
      }
    };
    save(state);
  }

  function buildIntervalItems(day){
    return day.lifts.map(lift => ({
      name: lift.name,
      work: parseDurationToSeconds(lift.reps),
      rest: parseDurationToSeconds(lift.rest)
    }));
  }

  function ensureIntervalTimer(day){
    intervalItems = buildIntervalItems(day);
    if(!state.timers.interval || state.timers.interval.dayId !== day.id){
      state.timers.interval = {dayId: day.id, index: 0, phase: "work", remaining: 0, running: false};
    }
    const saved = state.timers.interval;
    const maxIndex = Math.max(0, intervalItems.length - 1);
    intervalTimer.dayId = day.id;
    intervalTimer.index = clamp(saved.index || 0, 0, maxIndex);
    intervalTimer.phase = saved.phase === "rest" ? "rest" : "work";
    intervalTimer.running = false;
    intervalTimer.interval = null;
    const current = intervalItems[intervalTimer.index];
    const fallback = intervalTimer.phase === "rest" ? (current ? current.rest : 0) : (current ? current.work : 0);
    intervalTimer.remaining = Number.isFinite(saved.remaining) && saved.remaining > 0 ? saved.remaining : fallback;
    persistTimers();
  }

  function advanceIntervalPhase(){
    const lastIndex = intervalItems.length - 1;
    const current = intervalItems[intervalTimer.index];
    if(!current){
      pauseIntervalTimer();
      intervalTimer.remaining = 0;
      return;
    }
    playBeep();
    if(intervalTimer.phase === "work"){
      if(current.rest > 0 && intervalTimer.index < lastIndex){
        intervalTimer.phase = "rest";
        intervalTimer.remaining = current.rest;
      }else if(intervalTimer.index < lastIndex){
        intervalTimer.index += 1;
        intervalTimer.phase = "work";
        intervalTimer.remaining = intervalItems[intervalTimer.index].work;
      }else{
        pauseIntervalTimer();
        intervalTimer.remaining = 0;
      }
    }else{
      if(intervalTimer.index < lastIndex){
        intervalTimer.index += 1;
        intervalTimer.phase = "work";
        intervalTimer.remaining = intervalItems[intervalTimer.index].work;
      }else{
        pauseIntervalTimer();
        intervalTimer.remaining = 0;
      }
    }
    persistTimers();
  }

  function startIntervalTimer(){
    if(intervalTimer.running || !intervalItems.length) return;
    if(intervalTimer.remaining <= 0){
      const current = intervalItems[intervalTimer.index];
      intervalTimer.remaining = intervalTimer.phase === "rest" ? current.rest : current.work;
    }
    intervalTimer.running = true;
    updateWakeLock();
    intervalTimer.interval = setInterval(() => {
      intervalTimer.remaining -= 1;
      if(intervalTimer.remaining <= 0){
        intervalTimer.remaining = 0;
        advanceIntervalPhase();
      }
      persistTimers();
      updateIntervalUI();
    }, 1000);
    updateIntervalUI();
  }

  function pauseIntervalTimer(){
    if(intervalTimer.interval){
      clearInterval(intervalTimer.interval);
      intervalTimer.interval = null;
    }
    intervalTimer.running = false;
    updateWakeLock();
    persistTimers();
  }

  function resetIntervalTimer(){
    pauseIntervalTimer();
    intervalTimer.index = 0;
    intervalTimer.phase = "work";
    const current = intervalItems[0];
    intervalTimer.remaining = current ? current.work : 0;
    persistTimers();
    updateIntervalUI();
  }

  function skipIntervalPhase(){
    pauseIntervalTimer();
    advanceIntervalPhase();
    startIntervalTimer();
  }

  function getIntervalDisplay(){
    const current = intervalItems[intervalTimer.index];
    const lastIndex = intervalItems.length - 1;
    const phaseLabel = intervalTimer.phase === "rest" ? "Rest" : "Exercise";
    let currentLabel = current ? current.name : "No exercises";
    let nextLabel = "Next: Done";
    if(intervalTimer.phase === "rest"){
      currentLabel = "Rest";
      if(intervalTimer.index < lastIndex){
        nextLabel = `Next: ${intervalItems[intervalTimer.index + 1].name}`;
      }
    }else if(current){
      if(current.rest > 0 && intervalTimer.index < lastIndex){
        nextLabel = "Next: Rest";
      }else if(intervalTimer.index < lastIndex){
        nextLabel = `Next: ${intervalItems[intervalTimer.index + 1].name}`;
      }
    }
    const roundLabel = intervalItems.length ? `Move ${intervalTimer.index + 1} / ${intervalItems.length}` : "No moves";
    return {phaseLabel, currentLabel, nextLabel, roundLabel};
  }

  function getIntervalTotalRemaining(){
    if(!intervalItems.length) return 0;
    let total = Math.max(0, intervalTimer.remaining || 0);
    const lastIndex = intervalItems.length - 1;
    if(intervalTimer.phase === "work"){
      for(let i = intervalTimer.index; i <= lastIndex; i++){
        const item = intervalItems[i];
        if(!item) continue;
        if(i === intervalTimer.index){
          if(item.rest > 0 && i < lastIndex) total += item.rest;
        }else{
          total += item.work;
          if(item.rest > 0 && i < lastIndex) total += item.rest;
        }
      }
    }else{
      for(let i = intervalTimer.index + 1; i <= lastIndex; i++){
        const item = intervalItems[i];
        if(!item) continue;
        total += item.work;
        if(item.rest > 0 && i < lastIndex) total += item.rest;
      }
    }
    return total;
  }

  function updateIntervalUI(){
    const timeEl = $("#intervalTime");
    if(timeEl) timeEl.textContent = formatTime(intervalTimer.remaining);
    const statusEl = $("#intervalStatus");
    if(statusEl) statusEl.textContent = intervalTimer.running ? "Running" : "Ready";
    const phaseEl = $("#intervalPhaseLbl");
    const currentEl = $("#intervalExerciseLbl");
    const nextEl = $("#intervalNextLbl");
    const roundEl = $("#intervalRoundLbl");
    const display = getIntervalDisplay();
    if(phaseEl) phaseEl.textContent = display.phaseLabel;
    if(currentEl) currentEl.textContent = display.currentLabel;
    if(nextEl) nextEl.textContent = display.nextLabel;
    if(roundEl) roundEl.textContent = display.roundLabel;
    const pauseBtn = $("#intervalPauseBtn");
    if(pauseBtn){
      pauseBtn.innerHTML = `${intervalTimer.running ? ICONS.pause : ICONS.play}<span class="label">${intervalTimer.running ? "Pause" : "Resume"}</span>`;
    }
    const intervalAudioBtn = $("#intervalAudioBtn");
    if(intervalAudioBtn) intervalAudioBtn.style.display = audioUnlocked ? "none" : "inline-flex";
    const totalRemainingEl = $("#intervalTotalRemaining");
    if(totalRemainingEl) totalRemainingEl.textContent = formatTime(getIntervalTotalRemaining());
  }

  function getSession(dayId){
    ensureWeek();
    const wk = state.weekStart;
    if(!state.sessions[wk][dayId]){
      state.sessions[wk][dayId] = {
        completed:false,
        liftDone:{},
        dayLocked:false
      };
    }
    return state.sessions[wk][dayId];
  }

  function countCompleted(){
    ensureWeek();
    const wk = state.weekStart;
    const obj = state.sessions[wk] || {};
    return Object.values(obj).filter(s => s && s.completed).length;
  }
  function countCompletedForWeek(weekKey){
    const obj = state.sessions[weekKey] || {};
    return Object.values(obj).filter(s => s && s.completed).length;
  }

  function renderTabs(){
    const tabs = $("#tabs");
    if(!tabs) return;
    tabs.innerHTML = "";
    PLAN.forEach(d => {
      const b = document.createElement("button");
      b.className = "tab" + (d.id === state.activeDayId ? " active" : "");
      b.textContent = d.short;
      b.onclick = () => { state.activeDayId = d.id; save(state); render(); };
      tabs.appendChild(b);
    });
    const weekLbl = $("#weekLbl");
    if(weekLbl) weekLbl.textContent = state.weekStart;
    const completedLbl = $("#completedLbl");
    if(completedLbl) completedLbl.textContent = String(countCompleted());
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function clamp(n, min, max){ return Math.min(max, Math.max(min, n)); }
  function formatTime(totalSec){
    const s = Math.max(0, Math.floor(totalSec));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return `${String(m).padStart(2,"0")}:${String(r).padStart(2,"0")}`;
  }
  function parseDurationToSeconds(value){
    if(typeof value !== "string") return 0;
    const cleaned = value.trim().toLowerCase();
    const match = cleaned.match(/(\d+)\s*(s|sec|secs|second|seconds|m|min|mins|minute|minutes)?/);
    if(!match) return 0;
    const amount = parseInt(match[1], 10);
    const unit = match[2] || "s";
    return unit.startsWith("m") ? amount * 60 : amount;
  }
  function weekSummaryCompletedRatio(sessions){
    const completed = PLAN.reduce((sum, d) => sum + (sessions[d.id] && sessions[d.id].completed ? 1 : 0), 0);
    return completed / PLAN.length;
  }
  function prevWeekKey(weekKey){
    return isoDate(addDays(new Date(weekKey + "T00:00:00"), -7));
  }
  function weekHasAnyData(weekKey){
    const sessions = state.sessions[weekKey] || {};
    return Object.values(sessions).some(s => {
      if(!s) return false;
      if(s.completed) return true;
      if(s.notes && String(s.notes).trim()) return true;
      if(s.liftDone && Object.values(s.liftDone).some(Boolean)) return true;
      return false;
    });
  }
  function prevWeekWithData(weekKey){
    const weeks = Object.keys(state.sessions || {})
      .filter(w => w < weekKey)
      .sort((a,b) => b.localeCompare(a));
    for(const wk of weeks){
      if(weekHasAnyData(wk)) return wk;
    }
    return null;
  }
  function applyDayLock(container, locked){
    if(!container) return;
    container.querySelectorAll("input, textarea, select, button").forEach(el => {
      if(el.hasAttribute("data-allow-when-locked")) return;
      el.disabled = !!locked;
    });
  }

  let audioCtx = null;
  let audioUnlocked = false;
  let noiseBuffer = null;
  let wakeLock = null;
  let wakeLockEnabled = false;
  async function resumeAudioIfNeeded(){
    try{
      if(!audioCtx) return;
      if(audioCtx.state === "suspended") await audioCtx.resume();
      audioUnlocked = audioCtx.state === "running";
    }catch(e){
      audioUnlocked = false;
    }
  }
  function playBeep(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      audioCtx = audioCtx || new Ctx();
      if(audioCtx.state === "suspended") audioCtx.resume();
      audioUnlocked = audioCtx.state === "running";
      const drop = (t) => {

        const carrier = audioCtx.createOscillator();
        const mod = audioCtx.createOscillator();
        const modGain = audioCtx.createGain();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        carrier.type = "sine";
        carrier.frequency.setValueAtTime(640, t);
        carrier.frequency.exponentialRampToValueAtTime(420, t + 0.18);

        mod.type = "sine";
        mod.frequency.setValueAtTime(28, t);
        modGain.gain.setValueAtTime(10, t);
        modGain.gain.exponentialRampToValueAtTime(0.1, t + 0.25);

        filter.type = "lowpass";
        filter.frequency.setValueAtTime(1800, t);
        filter.Q.value = 0.7;

        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.9, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);

        mod.connect(modGain);
        modGain.connect(carrier.frequency);
        carrier.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        carrier.start(t);
        mod.start(t);
        carrier.stop(t + 0.24);
        mod.stop(t + 0.24);
      };
      const base = audioCtx.currentTime + 0.02;
      drop(base);
      drop(base + 1.0);
      drop(base + 2.0);
    }catch(e){}
    if(navigator.vibrate){
      navigator.vibrate(120);
      setTimeout(() => navigator.vibrate(120), 1000);
      setTimeout(() => navigator.vibrate(120), 2000);
    }
  }
  async function unlockAudio(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return false;
      audioCtx = audioCtx || new Ctx();
      if(audioCtx.state === "suspended") await audioCtx.resume();
      audioUnlocked = audioCtx.state === "running";
      if(audioUnlocked){
        // short tap to confirm unlock
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "sine";
        o.frequency.value = 880;
        g.gain.value = 0.35;
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
        o.stop(audioCtx.currentTime + 0.15);
      }
      updateTimersUI();
      return audioUnlocked;
    }catch(e){
      updateTimersUI();
      return false;
    }
  }

  async function requestWakeLock(){
    if(!("wakeLock" in navigator)) return;
    try{
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLockEnabled = true;
      wakeLock.addEventListener("release", () => {
        wakeLockEnabled = false;
      });
    }catch(e){
      wakeLockEnabled = false;
    }
  }
  function releaseWakeLock(){
    if(wakeLock){
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
    wakeLockEnabled = false;
  }
  function updateWakeLock(){
    const shouldHold = timers.rest.running || intervalTimer.running;
    if(shouldHold){
      if(document.visibilityState === "visible" && !wakeLockEnabled){
        requestWakeLock();
      }
    }else{
      releaseWakeLock();
    }
  }

  function wireTimers(){
    const restMin = $("#restMin");
    const restSec = $("#restSec");
    const restSetBtn = $("#restSetBtn");
    const restPauseBtn = $("#restPauseBtn");
    const restResetBtn = $("#restResetBtn");
    const restCloseBtn = $("#restCloseBtn");
    const restPlusBtn = $("#restPlusBtn");
    const restMinusBtn = $("#restMinusBtn");

    if(restMin && restSec){
      const m = Math.floor(timers.rest.duration / 60);
      const s = timers.rest.duration % 60;
      restMin.value = String(m);
      restSec.value = String(s);
    }

    if(restSetBtn){
      restSetBtn.onclick = () => {
        const m = clamp(parseInt(restMin.value || "0", 10) || 0, 0, 59);
        const s = clamp(parseInt(restSec.value || "0", 10) || 0, 0, 59);
        const total = Math.max(5, (m * 60) + s);
        stopRestTimer();
        timers.rest.duration = total;
        timers.rest.remaining = total;
        persistTimers();
        updateTimersUI();
      };
    }

    if(restPauseBtn){
      restPauseBtn.onclick = () => {
        if(timers.rest.running){
          stopRestTimer();
        }else{
          startRestTimer();
        }
        persistTimers();
        updateTimersUI();
      };
    }

    if(restResetBtn){
      restResetBtn.onclick = () => {
        stopRestTimer();
        timers.rest.remaining = timers.rest.duration;
        persistTimers();
        updateTimersUI();
      };
    }

    if(restCloseBtn){
      restCloseBtn.onclick = () => {
        stopRestTimer();
        persistTimers();
        hideRestPopup();
        updateTimersUI();
      };
    }

    const enableAudioBtn = $("#enableAudioBtn");
    if(enableAudioBtn){
      enableAudioBtn.onclick = () => {
        unlockAudio();
        updateTimersUI();
      };
    }

    const adjustRest = (delta) => {
      timers.rest.remaining = clamp(timers.rest.remaining + delta, 5, 60 * 30);
      persistTimers();
      updateTimersUI();
    };
    if(restPlusBtn) restPlusBtn.onclick = () => adjustRest(15);
    if(restMinusBtn) restMinusBtn.onclick = () => adjustRest(-15);

    const workoutStartBtn = $("#workoutStartBtn");
    const workoutPauseBtn = $("#workoutPauseBtn");
    const workoutResetBtn = $("#workoutResetBtn");

    if(workoutStartBtn){
      workoutStartBtn.onclick = () => {
        if(timers.workout.running) return;
        timers.workout.running = true;
        updateWakeLock();
        timers.workout.interval = setInterval(() => {
          timers.workout.elapsed += 1;
          persistTimers();
          updateTimersUI();
        }, 1000);
        updateTimersUI();
      };
    }

    if(workoutPauseBtn){
      workoutPauseBtn.onclick = () => {
        stopWorkoutTimer();
        persistTimers();
        updateTimersUI();
      };
    }

    if(workoutResetBtn){
      workoutResetBtn.onclick = () => {
        if(!confirm("Reset workout timer?")) return;
        stopWorkoutTimer();
        timers.workout.elapsed = 0;
        persistTimers();
        updateTimersUI();
      };
    }

    const intervalStartBtn = $("#intervalStartBtn");
    const intervalPauseBtn = $("#intervalPauseBtn");
    const intervalResetBtn = $("#intervalResetBtn");
    const intervalSkipBtn = $("#intervalSkipBtn");

    if(intervalStartBtn){
      intervalStartBtn.onclick = () => {
        startIntervalTimer();
      };
    }

    if(intervalPauseBtn){
      intervalPauseBtn.onclick = () => {
        if(intervalTimer.running){
          pauseIntervalTimer();
        }else{
          startIntervalTimer();
        }
        updateIntervalUI();
      };
    }

    if(intervalResetBtn){
      intervalResetBtn.onclick = () => {
        if(!confirm("Reset interval timer?")) return;
        resetIntervalTimer();
      };
    }

    if(intervalSkipBtn){
      intervalSkipBtn.onclick = () => {
        skipIntervalPhase();
      };
    }

    const intervalAudioBtn = $("#intervalAudioBtn");
    if(intervalAudioBtn){
      intervalAudioBtn.onclick = () => {
        unlockAudio();
        updateIntervalUI();
      };
    }
  }

    if(overlay) overlay.classList.add("hidden");
  }
  const devNotesBtn = $("#devNotesBtn");
  if(devNotesBtn) devNotesBtn.onclick = openDevNotes;
  const devNotesClose = $("#devNotesClose");
  if(devNotesClose) devNotesClose.onclick = closeDevNotes;
  const devNotesOverlay = $("#devNotesOverlay");
  if(devNotesOverlay) devNotesOverlay.onclick = closeDevNotes;
  const devNotesAdd = $("#devNotesAdd");
  if(devNotesAdd){
    devNotesAdd.onclick = () => {
      const input = $("#devNotesInput");
      if(!input) return;
      const text = input.value.trim();
      if(!text) return;
      const notes = loadDevNotes();
      notes.push({id:`n_${Date.now()}_${Math.random().toString(36).slice(2,6)}`, text});
      saveDevNotes(notes);
      input.value = "";
      renderDevNotesList();
      input.focus();
    };
  }

  $("#resetBtn").onclick = () => {
    if(!confirm("Reset all saved data on this device?")) return;
    localStorage.removeItem(KEY);
    state = defaultState();
    save(state);
    render();
  };

  const dashboardBtn = $("#dashboardBtn");
  if(dashboardBtn){
    dashboardBtn.onclick = () => {
      state.activeDayId = "dashboard";
      save(state);
      render();
    };
  }

  // Init
  ensureWeek();
  save(state);
  scheduleWeeklyRollover();
  render();

})();
</script>
</body>
</html>

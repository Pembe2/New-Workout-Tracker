<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>5-Day Workout + Mobility Tracker</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">

</head>
<body>
<div class="safe-area-fix"></div>

<header>
  <div class="wrap">
    <div class="head">
      <div>
        <h1>5-Day Workout + Mobility Tracker</h1>
        <div class="sub">Lift hard, recover, hit steps, keep conditioning consistent. Saves on-device.</div>
      </div>
      <div class="row" style="position:relative">
        <button class="btn menuBtn iconOnly" id="menuToggle" aria-label="Menu">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M3 6h18M3 12h18M3 18h18"/>
          </svg>
        </button>
        <input type="file" id="importFile" style="display:none" accept=".json">
      </div>
    </div>
  </div>
</header>

<div class="menuLayer" id="menuLayer">
  <div class="menuOverlay" id="menuOverlay"></div>
  <div class="menuPopup" id="menuPopup">
    <a class="menuItem" href="index.html">Workout Index</a>
    <div class="hr" style="margin:4px 0"></div>
    <button class="menuItem" id="devNotesBtn">
      <img class="icon devNotesIcon devNotesIcon--dark" src="middle finger - white.svg" alt="">
      <img class="icon devNotesIcon devNotesIcon--light" src="middle finger -black.svg" alt="">
      Dev Notes
    </button>
    <button class="menuItem" id="themeToggle">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8z"/>
      </svg>
      Theme
    </button>
    <button class="menuItem" id="importBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12M8 11l4 4 4-4M4 21h16"/>
      </svg>
      Import
    </button>
    <button class="menuItem" id="exportBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21V9M8 13l4-4 4 4M4 3h16"/>
      </svg>
      Export
    </button>
    <button class="menuItem bad" id="resetBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6"/>
        <path d="M3 4v4h4"/>
      </svg>
      Reset
    </button>
  </div>
</div>

<main id="app"></main>

<div class="footerTabs">
  <div class="footerInner">
    <div class="tabs" id="tabs"></div>
    <div class="kpi">
      <span class="badge">Week: <span class="mono" id="weekLbl"></span></span>
      <span class="badge">Complete: <span class="mono" id="completedLbl">0</span>/5</span>
      <button class="btn primary" id="dashboardBtn">Dashboard</button>
    </div>
  </div>
</div>

<div class="devNotesOverlay hidden" id="devNotesOverlay"></div>
<div class="devNotesModal hidden" id="devNotesModal" role="dialog" aria-modal="true" aria-labelledby="devNotesTitle">
  <div class="row" style="justify-content:space-between; align-items:center">
    <h3 id="devNotesTitle" style="margin:0">Developer Comments</h3>
    <button class="btn" id="devNotesClose" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
      Close
    </button>
  </div>
  <div class="devNotesList" id="devNotesList"></div>
  <div class="small" style="margin-bottom:6px">Add a comment</div>
  <textarea id="devNotesInput" style="width:100%; height:80px; padding:10px; border-radius:12px; border:1px solid var(--line); background:var(--input-bg); color:var(--text); font-family:var(--sans); font-size:13px;" placeholder="Type a comment..."></textarea>
  <div class="row" style="justify-content:flex-end; margin-top:8px">
    <button class="btn good" id="devNotesAdd" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Add
    </button>
  </div>
</div>

<script>
(() => {
  const KEY = "workout_tracker_fatloss_v2";
  const ICONS = {

    remove: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>`,
    copy: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="10" height="10" rx="2"/><rect x="5" y="5" width="10" height="10" rx="2"/></svg>`,

    clock: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`,
    sound: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M16 9a5 5 0 0 1 0 6"/></svg>`,
    minus: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>`,
    plus: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>`,
    close: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`,
    check: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>`,
    unlock: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0"/></svg>`,
    trash: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>`,
    chevron: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>`
  };

  // Recommended information taken from the plan previously provided:
  // - Compound lifts: moderate-heavy with 1-2 reps in reserve, rest 90-180s
  // - Accessories: higher reps, rest 45-90s
  // - Conditioning day: circuit style, 60-90s between stations/rounds

  const PLAN = [
    {
      id:"d1", short:"Day 1", title:"Upper Push",
      mobility:[
        {name:"Thoracic extensions (foam roller)", dose:"2x8 slow reps", cue:"Exhale into extension; avoid cranking the neck."},
        {name:"Band shoulder pass-throughs", dose:"2x10", cue:"Ribs down; smooth range."},
        {name:"Scap push-ups", dose:"2x10", cue:"Move shoulder blades; elbows stay locked."},
      ],
      lifts:[
        {name:"Bench Press", sets:4, reps:"6-8", rest:"90-150s", cue:"Stop with 1-2 reps in reserve; controlled descent.", options:["BB","DB"]},
        {name:"Incline Bench Press", sets:3, reps:"8-10", rest:"90s", cue:"Full range; do not bounce.", options:["BB","DB"]},
        {name:"DB Overhead Press", sets:3, reps:"6-8", rest:"90-120s", cue:"Glutes tight; avoid excessive low-back arch.", options:["Standing","Seated"], cues:{
          "Standing": "Glutes tight, ribs down; avoid excessive low-back arch.",
          "Seated": "Tall posture, slight back support; keep ribs stacked over hips."
        }},
        {name:"DB Lateral Raise", sets:3, reps:"12-15", rest:"60s", cue:"No shrugging; slow lower."},
        {name:"Triceps Pushdown or Dips", sets:3, reps:"10-12", rest:"60-90s", cue:"Elbows pinned; full extension.", options:["Pushdown","Dips"]},
        { name:"Chest Fly", sets:3, reps:"12-15", rest:"60s", cue:"Soft elbows; stretch under control.", options:["Cable","DB"] },
        { name:"Overhead Tricep Extension", sets:3, reps:"10-12", rest:"60-90s", cue:"Elbows narrow; full stretch.", options:["DB","Cable"], cues:{
          "DB": "Elbows tucked; let the DB travel behind head for a full stretch.",
          "Cable": "Keep constant tension; elbows fixed, smooth lockout."
        } },
      ],
      conditioning:{label:"Extra Pump", rx:"Push-ups: 2 rounds near-failure (stop 1-2 reps before form breaks)."}
    },
    {
      id:"d2", short:"Day 2", title:"Lower Body",
      mobility:[
        {name:"90/90 hip switches", dose:"2x6/side", cue:"Stay tall; move slowly into range."},
        {name:"World's Greatest Stretch", dose:"1-2x/side", cue:"Long exhale; rotate through upper back."},
        {name:"Ankle dorsiflexion rocks", dose:"2x10/side", cue:"Heel stays down; knee tracks over toes."},
      ],
      lifts:[
        {name:"Squat", sets:4, reps:"5-8", rest:"120-180s", cue:"Brace hard; consistent depth; clean reps.", options:["Back","Front"]},
        {name:"Romanian Deadlift", sets:3, reps:"8", rest:"120s", cue:"Hinge; neutral spine; feel hamstrings."},
        {name:"Walking Lunges", sets:3, reps:"12/leg", rest:"90s", cue:"Long stride; stable knee."},
        {name:"Standing Calf Raises", sets:4, reps:"12-15", rest:"60s", cue:"Pause at top and bottom."},
        {name:"Plank", sets:3, reps:"45-60s", rest:"45-60s", cue:"Ribs down; squeeze glutes; breathe.", options:["Front","Side"]},
        { name:"Leg Curl", sets:3, reps:"10-15", rest:"60-90s", cue:"Control; squeeze hamstrings.", options:["Machine","Band"] },
        { name:"Hip Thrust", sets:3, reps:"8-12", rest:"90s", cue:"Posterior tilt; pause at top.", options:["BB","DB"] },
      ],
      conditioning:{label:"Optional Zone 2", rx:"Incline treadmill walk: 10 minutes easy (conversational pace)."}
    },
    {
      id:"d3", short:"Day 3", title:"Upper Pull",
      mobility:[
        {name:"Dead hang (passive)", dose:"2x20-40s", cue:"Relax shoulders; no forced stretch."},
        {name:"Band pull-aparts", dose:"2x15", cue:"Squeeze shoulder blades; avoid arching back."},
        {name:"Cat-cow", dose:"1x8", cue:"Segment the spine; slow controlled motion."},
      ],
      lifts:[
        {name:"Pull-ups or Lat Pulldown", sets:4, reps:"6-10", rest:"120s", cue:"Full stretch at bottom; no kipping.", options:["Pull-ups","Lat Pulldown"]},
        {name:"Row", sets:3, reps:"8-10", rest:"120s", cue:"Pull to hip; keep neck neutral.", options:["BB","DB"]},
        {name:"Three Point DB Row", sets:3, reps:"10/side", rest:"90s", cue:"Pause at top; controlled lower."},
        {name:"Face Pulls", sets:3, reps:"12-15", rest:"60s", cue:"Elbows high; squeeze rear delts."},
        {name:"Biceps Curl", sets:3, reps:"10-12", rest:"60-90s", cue:"No swing; full extension.", options:["BB","DB"]},
        { name:"Rear Delt Fly", sets:3, reps:"12-15", rest:"60s", cue:"Lead with elbows; no shrug.", options:["DB","Cable"] },
        { name:"Hammer Curl or Preacher Curl", sets:3, reps:"10-12", rest:"60-90s", cue:"Neutral wrist; no swing.", options:["Hammer Curl","Preacher Curl"], cues:{
          "Hammer Curl": "Neutral wrist; keep elbows pinned, no swing.",
          "Preacher Curl": "Elbows fixed on pad; full stretch and controlled reps."
        } },
      ],
      conditioning:{label:"Optional intervals", rx:"Rower: 8 min (20s hard / 40s easy). Keep technique clean."}
    },
    {
      id:"d4", short:"Day 4", title:"Conditioning + Core",
      mobility:[
        {name:"Couch stretch (hip flexor)", dose:"1-2x45s/side", cue:"Posterior pelvic tilt; squeeze glute."},
        {name:"Open books (T-spine rotation)", dose:"1x8/side", cue:"Knees stacked; slow rotation."},
        {name:"90/90 breathing reset", dose:"2 minutes", cue:"Long exhale; ribs down."},
      ],
      lifts:[
        {name:"Kettlebell Swings", sets:4, reps:"20", rest:"60-90s", cue:"Hinge; snap hips; neutral spine."},
        {name:"Box Jumps or Step-ups", sets:4, reps:"10", rest:"60-90s", cue:"Land softly; stop before sloppy reps.", options:["Box Jump","Step-up"]},
        {name:"Burpees", sets:4, reps:"10-15", rest:"60-90s", cue:"Chest to floor; jump at top."},
        {name:"Hanging Leg Raises or Dead Bug", sets:4, reps:"10-15", rest:"60-90s", cue:"Control; no swinging.", options:["Hanging","Dead Bug"]},
        {name:"Ab Wheel or Plank", sets:4, reps:"8-10", rest:"60-90s", cue:"Ribs down; no low-back sag.", options:["Ab Wheel","Plank"]},
        { name:"Sled Push or Bike Sprint", sets:6, reps:"20-30s", rest:"60-90s", cue:"Strong posture; steady drive.", options:["Sled Push","Bike Sprint"], cues:{
            "Sled Push": "Strong posture; steady drive.",
            "Bike Sprint": "High resistance; stand up and drive hard."
          }
        },
        { name:"Russian Twists", sets:3, reps:"12-15/side", rest:"45-60s", cue:"Rotate shoulders, not just hands; control tempo." },
      ],
      conditioning:{label:"Zone 2 add-on", rx:"Optional: 10-20 minutes Zone 2 (easy conversational pace)."}
    },
    {
      id:"d5", short:"Day 5", title:"Full Body",
      mobility:[
        {name:"Glute bridge", dose:"2x10", cue:"Posterior tilt; feel glutes, not low back."},
        {name:"Hamstring floss (gentle)", dose:"1x10", cue:"No ballistic stretching; easy range."},
        {name:"Band external rotations", dose:"2x12", cue:"Elbow pinned to side; slow rotation."},
      ],
      lifts:[
        {name:"Deadlift (moderate load)", sets:3, reps:"5", rest:"150-180s", cue:"Crisp reps; stop short of grinding."},
        {name:"Incline Bench Press", sets:3, reps:"8-10", rest:"90s", cue:"Full range; do not bounce.", options:["BB","DB"]},
        {name:"Chin-ups or Assisted", sets:3, reps:"AMRAP", rest:"120s", cue:"Stop 1 rep before form breaks.", options:["Chin-ups","Assisted"]},
        {name:"Goblet Squat", sets:3, reps:"12", rest:"90s", cue:"Upright torso; elbows inside knees."},
        {name:"Farmer's Carries", sets:3, reps:"40-60s", rest:"60-90s", cue:"Tall posture; slow controlled steps."},
        { name:"Seated Cable Row or Chest-Supported Row", sets:3, reps:"10-12", rest:"90s", cue:"Pause at squeeze; no jerking.", options:["Cable","Chest-Supported"] },
        { name:"DB Bulgarian Split Squat", sets:3, reps:"8-10/leg", rest:"90s", cue:"Vertical shin; control depth." },
      ],
      conditioning:{label:"Optional easy finish", rx:"Incline walk: 8-12 minutes easy."}
    }
  ];

  const $ = (s, el=document) => el.querySelector(s);

  function isoDate(d=new Date()){ return d.toISOString().slice(0,10); }
  function weekStartKey(d=new Date()){
    const x = new Date(d);
    const day = (x.getDay()+6)%7; // Mon=0
    x.setDate(x.getDate()-day);
    return isoDate(x);
  }
  function weekStartKeyWithCutoff(d=new Date()){
    const x = new Date(d);
    if(x.getDay() === 0 && x.getHours() >= 23){
      return weekStartKey(addDays(x, 1));
    }
    return weekStartKey(x);
  }
  function addDays(d, n){
    const x = new Date(d);
    x.setDate(x.getDate() + n);
    return x;
  }
  function nextSundayAt23(d=new Date()){
    const x = new Date(d);
    const day = x.getDay(); // Sun=0
    let daysUntil = (7 - day) % 7;
    if(day === 0 && x.getHours() >= 23) daysUntil = 7;
    const target = addDays(x, daysUntil);
    target.setHours(23, 0, 0, 0);
    return target;
  }

  function load(){
    try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; }
  }
  function save(state){
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  function defaultState(){
    return {
      weekStart: weekStartKeyWithCutoff(),
      activeDayId: PLAN[0].id,
      sessions: {}, // weekStart -> dayId -> data
      viewWeekStart: null,
      timers: {
        restDuration: 90,
        restRemaining: 90,
        workoutElapsed: 0,
        theme: "dark"
      }
    };
  }

  const LEGACY_LIFT_NAME_MAP = {
    "Bench Press (BB or DB)": "Bench Press",
    "Incline Bench Press (BB or DB)": "Incline Bench Press",
    "DB Overhead Press (Standing or Seated)": "DB Overhead Press",
    "Cable or DB Chest Fly": "Chest Fly",
    "Overhead Tricep Extension (DB or Cable)": "Overhead Tricep Extension",
    "Squat (Back or Front)": "Squat",
    "Plank (Front or Side)": "Plank",
    "Leg Curl (Machine or Band)": "Leg Curl",
    "Hip Thrust (BB or DB)": "Hip Thrust",
    "Row (BB or DB)": "Row",
    "Biceps Curl (BB or DB)": "Biceps Curl",
    "Rear Delt Fly (DB or Cable)": "Rear Delt Fly",
    "Triceps Pushdown (or Dips)": "Triceps Pushdown or Dips",
    "Pull-ups (or Lat Pulldown)": "Pull-ups or Lat Pulldown",
    "Box Jumps (or Step-ups)": "Box Jumps or Step-ups",
    "Hanging Leg Raises (or Dead Bug)": "Hanging Leg Raises or Dead Bug",
    "Ab Wheel (or Plank)": "Ab Wheel or Plank",
    "Sled Push (or Bike Sprint)": "Sled Push or Bike Sprint",
    "Chin-ups (or assisted)": "Chin-ups or Assisted",
    "Seated Cable Row (or Chest-Supported Row)": "Seated Cable Row or Chest-Supported Row"
  };

  function remapStorageKey(obj, oldName, newName){
    if(!obj) return false;
    let changed = false;
    if(Object.prototype.hasOwnProperty.call(obj, oldName)){
      if(!Object.prototype.hasOwnProperty.call(obj, newName)){
        obj[newName] = obj[oldName];
      }
      delete obj[oldName];
      changed = true;
    }
    const prefix = `${oldName}::`;
    Object.keys(obj).forEach(k => {
      if(!k.startsWith(prefix)) return;
      const nextKey = `${newName}${k.slice(oldName.length)}`;
      if(!Object.prototype.hasOwnProperty.call(obj, nextKey)){
        obj[nextKey] = obj[k];
      }
      delete obj[k];
      changed = true;
    });
    return changed;
  }

  function migrateLegacyLiftNames(stateObj){
    if(!stateObj || !stateObj.sessions) return false;
    let changed = false;
    Object.values(stateObj.sessions).forEach(weekSessions => {
      if(!weekSessions) return;
      Object.entries(weekSessions).forEach(([dayId, session]) => {
        if(!session) return;
        Object.entries(LEGACY_LIFT_NAME_MAP).forEach(([oldName, newName]) => {
          if(remapStorageKey(session.liftSets, oldName, newName)) changed = true;
          if(remapStorageKey(session.extraSets, oldName, newName)) changed = true;
          if(remapStorageKey(session.restOverrides, oldName, newName)) changed = true;
          if(session.liftOptions){
            const oldOptKey = `${dayId}::${oldName}`;
            const newOptKey = `${dayId}::${newName}`;
            if(Object.prototype.hasOwnProperty.call(session.liftOptions, oldOptKey)){
              if(!Object.prototype.hasOwnProperty.call(session.liftOptions, newOptKey)){
                session.liftOptions[newOptKey] = session.liftOptions[oldOptKey];
              }
              delete session.liftOptions[oldOptKey];
              changed = true;
            }
          }
        });
      });
    });
    return changed;
  }

  let state = load() || defaultState();
  if(migrateLegacyLiftNames(state)){
    save(state);
  }
  const openLifts = new Set();
  const timers = {
    rest:{duration:90, remaining:90, running:false, interval:null},
    workout:{elapsed:0, running:false, interval:null}
  };
  let currentRestLiftKey = null;
  let currentSession = null;
  let weeklyRolloverTimer = null;

  // Apply theme immediately
  if(!state.theme) state.theme = "dark";
  if(state.theme === "light") document.body.classList.add("light");
  else document.body.classList.remove("light");

  function ensureWeek(){
    const wk = weekStartKeyWithCutoff();
    if(state.weekStart !== wk){
      const oldWeek = state.weekStart;
      state.weekStart = wk;
      state.activeDayId = PLAN[0].id;
      if(!state.viewWeekStart || state.viewWeekStart === oldWeek){
        state.viewWeekStart = wk;
      }
    }
    if(!state.sessions[state.weekStart]) state.sessions[state.weekStart] = {};
    if(!state.viewWeekStart) state.viewWeekStart = state.weekStart;
  }

  function scheduleWeeklyRollover(){
    if(weeklyRolloverTimer){
      clearTimeout(weeklyRolloverTimer);
      weeklyRolloverTimer = null;
    }
    const now = new Date();
    const target = nextSundayAt23(now);
    const ms = Math.max(1000, target.getTime() - now.getTime());
    weeklyRolloverTimer = setTimeout(() => {
      ensureWeek();
      state.viewWeekStart = state.weekStart;
      save(state);
      render();
      scheduleWeeklyRollover();
    }, ms);
  }

  function ensureTimers(){
    if(!state.timers) state.timers = {restDuration:90, restRemaining:90, workoutElapsed:0};
    if(!Number.isFinite(state.timers.restDuration)) state.timers.restDuration = 90;
    if(!Number.isFinite(state.timers.restRemaining)) state.timers.restRemaining = state.timers.restDuration;
    if(!Number.isFinite(state.timers.workoutElapsed)) state.timers.workoutElapsed = 0;
    timers.rest.duration = state.timers.restDuration;
    timers.rest.remaining = state.timers.restRemaining;
    timers.workout.elapsed = state.timers.workoutElapsed;
    persistTimers();
  }

  function persistTimers(){
    state.timers = {
      restDuration: timers.rest.duration,
      restRemaining: timers.rest.remaining,
      workoutElapsed: timers.workout.elapsed
    };
    save(state);
  }

  function getSession(dayId){
    ensureWeek();
    const wk = state.weekStart;
    if(!state.sessions[wk][dayId]){
      state.sessions[wk][dayId] = {
        completed:false,
        mobilityDone:{},
        liftSets:{},  // liftName[::option] -> [{reps,weight,rpe,done}]
        liftOptions:{},
        extraSets:{},     // NEW: liftStorageKey -> number of extra sets
        abDone:false,
        restOverrides:{},
        conditioningMinutes:"",
        conditioningPushups:{set1:"", set2:""},
        dayLocked:false
      };
    }
    return state.sessions[wk][dayId];
  }

  function countCompleted(){
    ensureWeek();
    const wk = state.weekStart;
    const obj = state.sessions[wk] || {};
    return Object.values(obj).filter(s => s && s.completed).length;
  }
  function countCompletedForWeek(weekKey){
    const obj = state.sessions[weekKey] || {};
    return Object.values(obj).filter(s => s && s.completed).length;
  }

  function renderTabs(){
    const tabs = $("#tabs");
    tabs.innerHTML = "";
    PLAN.forEach(d => {

  function getOverloadSuggestion(lift, prevSets){
    // 1. Check for valid history
    const valid = prevSets.filter(s => s.done && parseNum(s.weight) !== null && parseNum(s.reps) !== null);
    if(!valid.length) return null;

    // 2. Find best set (heaviest weight, then most reps)
    valid.sort((a,b) => {
      const wA = parseNum(a.weight), wB = parseNum(b.weight);
      if(wA !== wB) return wB - wA;
      return parseNum(b.reps) - parseNum(a.reps);
    });
    const best = valid[0];
    const lastWeight = parseNum(best.weight);
    const lastReps = parseNum(best.reps);

    // 3. Parse target reps (e.g. "6-8" -> 8)
    if(lift.reps.toLowerCase().includes("amrap")) return `Beat ${lastReps} reps @ ${lastWeight} lbs`;
    const nums = lift.reps.match(/\d+/g);
    if(!nums) return null;
    const maxTarget = parseInt(nums[nums.length-1]);

    // 4. Generate Tip
    if(lastReps >= maxTarget){
      return `Target hit! Try ${lastWeight + 5} lbs`;
    } else {
      return `Aim for ${lastReps + 1} reps @ ${lastWeight} lbs`;
    }
  }

  async function resumeAudioIfNeeded(){
    try{
      if(!audioCtx) return;

    }catch(e){
      audioUnlocked = false;

  function playBeep(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      audioCtx = audioCtx || new Ctx();
      if(audioCtx.state === "suspended") audioCtx.resume();
      audioUnlocked = audioCtx.state === "running";
      const drop = (t) => {

        const carrier = audioCtx.createOscillator();
        const mod = audioCtx.createOscillator();
        const modGain = audioCtx.createGain();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        carrier.type = "sine";
        carrier.frequency.setValueAtTime(640, t);
        carrier.frequency.exponentialRampToValueAtTime(420, t + 0.18);

        mod.type = "sine";
        mod.frequency.setValueAtTime(28, t);
        modGain.gain.setValueAtTime(10, t);
        modGain.gain.exponentialRampToValueAtTime(0.1, t + 0.25);

        filter.type = "lowpass";
        filter.frequency.setValueAtTime(1800, t);
        filter.Q.value = 0.7;

        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.9, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);

        mod.connect(modGain);
        modGain.connect(carrier.frequency);
        carrier.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        carrier.start(t);
        mod.start(t);
        carrier.stop(t + 0.24);
        mod.stop(t + 0.24);
      };
      const base = audioCtx.currentTime + 0.02;
      drop(base);
      drop(base + 1.0);
      drop(base + 2.0);
    }catch(e){}
    if(navigator.vibrate){
      navigator.vibrate(120);
      setTimeout(() => navigator.vibrate(120), 1000);
      setTimeout(() => navigator.vibrate(120), 2000);
    }
  }
  async function unlockAudio(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return false;
      audioCtx = audioCtx || new Ctx();
      if(audioCtx.state === "suspended") await audioCtx.resume();
      audioUnlocked = audioCtx.state === "running";
      if(audioUnlocked){
        // short tap to confirm unlock
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "sine";
        o.frequency.value = 880;
        g.gain.value = 0.35;
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
        o.stop(audioCtx.currentTime + 0.15);
      }
      updateTimersUI();
      return audioUnlocked;
    }catch(e){
      updateTimersUI();
      return false;
    }
  }

  function parseRestToSeconds(restStr){

  function liftOptionKey(dayId, lift){
    return `${dayId}::${lift.name}`;
  }
  function liftStorageKey(lift, option){
    if(lift.options && option) return `${lift.name}::${option}`;
    return lift.name;
  }
  function getExtraSets(session, lift, option){
    if(!session.extraSets) session.extraSets = {};
    const key = liftStorageKey(lift, option);
    return session.extraSets[key] || 0;
  }
  function setExtraSets(session, lift, option, n){
    if(!session.extraSets) session.extraSets = {};
    const key = liftStorageKey(lift, option);
    session.extraSets[key] = Math.max(0, n|0);
  }
  function findStoredOption(session, lift){
    if(!session || !session.liftSets || !lift.options) return null;
    const prefix = `${lift.name}::`;
    const match = Object.keys(session.liftSets).find(k => k.startsWith(prefix));
    return match ? match.slice(prefix.length) : null;
  }
  function resolveLiftOption(session, dayId, lift){
    if(!lift.options || !lift.options.length) return null;
    const key = liftOptionKey(dayId, lift);
    if(session && session.liftOptions && lift.options.includes(session.liftOptions[key])){
      return session.liftOptions[key];
    }
    if(session && session.liftSets && session.liftSets[lift.name]){
      return lift.options[0];
    }
    const stored = findStoredOption(session, lift);
    if(stored && lift.options.includes(stored)) return stored;
    return lift.options[0];
  }
  function getLiftOption(session, dayId, lift){
    const opt = resolveLiftOption(session, dayId, lift);
    if(!opt) return null;
    if(!session.liftOptions) session.liftOptions = {};
    const key = liftOptionKey(dayId, lift);
    if(session.liftOptions[key] !== opt){
      session.liftOptions[key] = opt;
    }
    return opt;
  }
  function ensureLiftArray(session, lift, option){
    const key = liftStorageKey(lift, option);

    // migrate old key if options changed
    if(lift.options && !session.liftSets[key] && session.liftSets[lift.name]){
      session.liftSets[key] = session.liftSets[lift.name];
      delete session.liftSets[lift.name];
    }

    if(!session.liftSets[key]) session.liftSets[key] = [];

    // total sets = planned sets + user-added extra sets (per lift/option)
    const extra = getExtraSets(session, lift, option);
    const targetLen = (lift.sets || 0) + extra;

    const arr = session.liftSets[key];
    while(arr.length < targetLen) arr.push({reps:"", weight:"", rpe:"", done:false});
    if(arr.length > targetLen) arr.length = targetLen;

    return arr;
  }
  function getLiftSets(session, dayId, lift){
    if(!session || !session.liftSets) return [];
    const opt = resolveLiftOption(session, dayId, lift);
    const key = liftStorageKey(lift, opt);
    if(session.liftSets[key]) return session.liftSets[key];
    if(lift.options && session.liftSets[lift.name]) return session.liftSets[lift.name];
    return [];
  }
  function liftDetailKey(dayId, lift){
    return `${dayId}::${lift.name}`;
  }
  function hasLiftData(sets){
    return (sets || []).some(s => s && (s.done || s.reps || s.weight || s.rpe));
  }
  function getPrevLiftData(dayId, lift, preferredOption){
    const currentWeek = state.weekStart;
    const weeks = Object.keys(state.sessions || {})
      .filter(w => w < currentWeek)
      .sort((a,b) => b.localeCompare(a));
    for(const wk of weeks){
      const s = state.sessions[wk] && state.sessions[wk][dayId];
      if(!s) continue;

      if(lift.options && lift.options.length){
        if(preferredOption && lift.options.includes(preferredOption)){
          const key = liftStorageKey(lift, preferredOption);
          const sets = (s.liftSets && s.liftSets[key]) ? s.liftSets[key] : [];
          if(hasLiftData(sets)) return {weekKey:wk, session:s, option:preferredOption, sets};
        }else{
          const opt = resolveLiftOption(s, dayId, lift);
          const key = opt ? liftStorageKey(lift, opt) : lift.name;
          const sets = (s.liftSets && s.liftSets[key]) ? s.liftSets[key] : getLiftSets(s, dayId, lift);
          if(hasLiftData(sets)) return {weekKey:wk, session:s, option:opt, sets};

          if(s.liftSets){
            const prefix = `${lift.name}::`;
            const keys = Object.keys(s.liftSets).filter(k => k === lift.name || k.startsWith(prefix));
            for(const k of keys){
              const arr = s.liftSets[k] || [];
              if(hasLiftData(arr)){
                const opt2 = k.startsWith(prefix) ? k.slice(prefix.length) : lift.options[0];
                return {weekKey:wk, session:s, option:opt2, sets: arr};
              }
            }
          }
        }
      }else{
        const sets = getLiftSets(s, dayId, lift);
        if(hasLiftData(sets)) return {weekKey:wk, session:s, option:null, sets};
      }
    }
    return {weekKey:null, session:null, option:null, sets:[]};
  }

  function updateAutoComplete(session, day){
    if(session.dayLocked){
      session.completed = true;
      return;
    }
    const anyMob = Object.values(session.mobilityDone || {}).some(Boolean);
    const anySet = day.lifts.some(l => {
      const arr = getLiftSets(session, day.id, l);
      return arr.some(s => s && s.done);
    });
    session.completed = anyMob || anySet;
  }

  function render(){
    ensureWeek();
    ensureTimers();
    const day = PLAN.find(d => d.id === state.activeDayId) || PLAN[0];
    const session = getSession(day.id);
    currentSession = session;
    const prevCompleted = session.completed;
    updateAutoComplete(session, day);
    if(session.completed !== prevCompleted) save(state);

    const app = $("#app");

    const viewWeek = state.viewWeekStart || state.weekStart;
    const weekSummary = (() => {
      const wk = viewWeek;
      const sessions = state.sessions[wk] || {};
      let totalSets = 0;
      let doneSets = 0;
      let mobTotal = 0;
      let mobDone = 0;
      let condTotal = 0;
      let absDone = 0;
      const days = PLAN.map(d => {
        const s = sessions[d.id];
        const dayTotalSets = d.lifts.reduce((sum, l) => sum + l.sets, 0);
        totalSets += dayTotalSets;
        mobTotal += d.mobility.length;
        let dayDoneSets = 0;
        let dayMobDone = 0;
        let dayCond = 0;
        let dayAbsDone = 0;
        let completed = false;
        if(s){
          completed = !!s.completed;
          dayMobDone = Object.values(s.mobilityDone || {}).filter(Boolean).length;
          dayCond = parseFloat(s.conditioningMinutes) || 0;
          dayAbsDone = s.abDone ? 1 : 0;
          d.lifts.forEach(l => {
            const arr = getLiftSets(s, d.id, l);
            dayDoneSets += arr.filter(x => x.done).length;
          });
        }
        doneSets += dayDoneSets;
        mobDone += dayMobDone;
        condTotal += dayCond;
        absDone += dayAbsDone;
        return {
          title: d.title,
          completed,
          doneSets: dayDoneSets,
          totalSets: dayTotalSets,
          mobDone: dayMobDone,
          mobTotal: d.mobility.length,
          cond: dayCond,
          abDone: dayAbsDone
        };
      });
      const dayCompletion = weekSummaryCompletedRatio(sessions);
      const setsRatio = totalSets ? (doneSets / totalSets) : 0;

      </div>

      <div class="card">
        <div class="ch">
          <h2>5-Minute Ab Workout</h2>
          <span class="badge">Optional</span>
        </div>
        <div class="cb">
          <div class="row" style="justify-content:space-between; align-items:center">
            <div>
              <button class="btn" type="button" onclick="location.href='ab-5-minute.html'">Ab Workout</button>
            </div>
            <label class="done" style="display:flex; flex-direction:column; align-items:center; gap:4px">
              <span class="small">Done</span>
              <input type="checkbox" id="abDone" ${session.abDone ? "checked":""}>
            </label>
          </div>
        </div>
      </div>

      ${day.id === "d1" ? `
      <div class="card">
        <div class="ch">
          <h2>Optional Conditioning</h2>
          <span class="badge">Conditioning</span>
        </div>
        <div class="cb">
          <div class="small">Incline treadmill walk for 10-15 minutes at an easy conversational pace.</div>
          <div class="hr"></div>
          <div class="row">
            <div style="flex:1 1 220px">
              <div class="small" style="margin-bottom:6px">Conditioning minutes completed (optional)</div>
              <input id="condMin" type="number" style="width:100%; padding:10px 10px; border-radius:12px; border:1px solid var(--line); background:var(--input-bg); color:var(--text);"
                     inputmode="numeric" min="0" step="0.1" placeholder="e.g., 15" value="${escapeHtml(session.conditioningMinutes||"")}">
            </div>
          </div>
        </div>
      </div>
      ` : ``}

      <div class="card">
        <div class="ch">
          <h2>Session Notes</h2>
          <span class="badge">Log</span>
        </div>
        <div class="cb">
          <textarea id="sessionNotes" style="width:100%; height:80px; padding:10px; border-radius:12px; border:1px solid var(--line); background:var(--input-bg); color:var(--text); font-family:var(--sans); font-size:13px;" placeholder="How did it feel? Pain? Energy levels?">${escapeHtml(session.notes || "")}</textarea>
        </div>
      </div>

      <div class="card">
        <div class="ch">
          <h2>Day Complete</h2>
          <span class="badge">${session.dayLocked ? "Locked" : "Unlocked"}</span>
        </div>
        <div class="cb">
          <div class="small" style="margin-bottom:8px">Locks all inputs for this day.</div>
          <button class="btn good" id="dayCompleteBtn" data-allow-when-locked="1">
            ${session.dayLocked ? `${ICONS.unlock}<span class="label">Unlock Day</span>` : `${ICONS.check}<span class="label">Mark Day Complete</span>`}
          </button>
        </div>
      </div>
    `;

    // Wire events (mobility)
    app.querySelectorAll('input[type="checkbox"][data-mob]').forEach(cb => {
      cb.addEventListener("change", () => {
        session.mobilityDone[cb.getAttribute("data-mob")] = cb.checked;
        updateAutoComplete(session, day);
        save(state);
        renderTabs();
      });
    });

    const abDone = $("#abDone");
    if(abDone){
      abDone.addEventListener("change", () => {
        session.abDone = abDone.checked;
        save(state);
        renderTabs();
      });
    }

    // Wire events (lift inputs)
    app.querySelectorAll('input[data-lift]').forEach(inp => {
      const liftName = inp.getAttribute("data-lift");
      const liftOpt = inp.getAttribute("data-opt") || null;
      const field = inp.getAttribute("data-field");
      const idx = parseInt(inp.getAttribute("data-idx"), 10);

      inp.addEventListener("input", () => {
        const liftDef = day.lifts.find(x => x.name === liftName);
        const arr = ensureLiftArray(session, liftDef, liftOpt);
        arr[idx][field] = inp.value;
        save(state);
      });

        if(inp.type === "checkbox"){
          inp.addEventListener("change", () => {
            const liftDef = day.lifts.find(x => x.name === liftName);
            const arr = ensureLiftArray(session, liftDef, liftOpt);
            arr[idx][field] = inp.checked;
            updateAutoComplete(session, day);
            save(state);
            renderTabs();
            if(field === "done" && inp.checked){
              const restSeconds = getRestSecondsForLift(session, liftDef, liftOpt);
              startRestTimer(restSeconds, liftStorageKey(liftDef, liftOpt));
            }
          });
        }
    });

    app.querySelectorAll(".optBtn").forEach(btn => {
      btn.addEventListener("click", () => {
        const liftName = btn.getAttribute("data-lift");
        const opt = btn.getAttribute("data-opt");
        const liftDef = day.lifts.find(x => x.name === liftName);
        if(!liftDef || !opt) return;
        openLifts.add(liftDetailKey(day.id, liftDef));
        if(!session.liftOptions) session.liftOptions = {};
        const key = liftOptionKey(day.id, liftDef);
        session.liftOptions[key] = opt;
        save(state);
        render();
      });
    });

    app.querySelectorAll("details[data-detail]").forEach(el => {
      el.addEventListener("toggle", () => {
        const key = el.getAttribute("data-detail");
        if(!key) return;
        if(el.open){
          openLifts.add(key);
        }else{
          openLifts.delete(key);
        }
      });
    });

    // Add/Remove sets
    app.querySelectorAll("button[data-addset]").forEach(btn => {
      btn.addEventListener("click", () => {
        const liftName = btn.getAttribute("data-lift");
        const liftOpt = btn.getAttribute("data-opt") || null;
        const liftDef = day.lifts.find(x => x.name === liftName);
        if(!liftDef) return;

        const cur = getExtraSets(session, liftDef, liftOpt);
        setExtraSets(session, liftDef, liftOpt, cur + 1);

        openLifts.add(liftDetailKey(day.id, liftDef)); // keep open
        save(state);
        render();
      });
    });

    app.querySelectorAll("button[data-rmset]").forEach(btn => {
      btn.addEventListener("click", () => {
        const liftName = btn.getAttribute("data-lift");
        const liftOpt = btn.getAttribute("data-opt") || null;
        const liftDef = day.lifts.find(x => x.name === liftName);
        if(!liftDef) return;

        const cur = getExtraSets(session, liftDef, liftOpt);
        if(cur <= 0) return;
        setExtraSets(session, liftDef, liftOpt, cur - 1);

        openLifts.add(liftDetailKey(day.id, liftDef)); // keep open
        save(state);
        render();
      });
    });

    // Copy previous values
    app.querySelectorAll("button[data-copyprev]").forEach(btn => {
      btn.addEventListener("click", () => {
        const liftName = btn.getAttribute("data-lift");
        const liftOpt = btn.getAttribute("data-opt") || null;
        const liftDef = day.lifts.find(x => x.name === liftName);
        if(!liftDef) return;

        const prevData = getPrevLiftData(day.id, liftDef, liftOpt);
        if(!hasLiftData(prevData.sets)) return;

        let targetOpt = liftOpt || prevData.option || null;
        if(liftDef.options && targetOpt && !liftDef.options.includes(targetOpt)){
          targetOpt = liftDef.options[0];
        }

        if(liftDef.options && targetOpt){
          if(!session.liftOptions) session.liftOptions = {};
          const key = liftOptionKey(day.id, liftDef);
          session.liftOptions[key] = targetOpt;
        }

        const desiredExtra = Math.max(0, (prevData.sets || []).length - (liftDef.sets || 0));
        setExtraSets(session, liftDef, targetOpt, desiredExtra);
        const arr = ensureLiftArray(session, liftDef, targetOpt);

        for(let i=0; i<arr.length; i++){
          const prevSet = (prevData.sets || [])[i];
          arr[i].reps = prevSet ? (prevSet.reps || "") : "";
          arr[i].weight = prevSet ? (prevSet.weight || "") : "";
          arr[i].rpe = prevSet ? (prevSet.rpe || "") : "";
          arr[i].done = false;
        }

        save(state);
        render();
      });
    });

    // Session Notes
    $("#sessionNotes").addEventListener("input", (e) => {
      session.notes = e.target.value;
      save(state);
    });


    // Conditioning tracking
    const condMin = $("#condMin");
    if(condMin){
      condMin.addEventListener("input", () => {
        session.conditioningMinutes = condMin.value;
        save(state);
      });
    }
    const pushupSet1 = $("#pushupSet1");
    const pushupSet2 = $("#pushupSet2");
    if(pushupSet1 || pushupSet2){
      if(!session.conditioningPushups) session.conditioningPushups = {set1:"", set2:""};
      if(pushupSet1){
        pushupSet1.addEventListener("input", () => {
          session.conditioningPushups.set1 = pushupSet1.value;
          save(state);
        });
      }
      if(pushupSet2){
        pushupSet2.addEventListener("input", () => {
          session.conditioningPushups.set2 = pushupSet2.value;
          save(state);
        });
      }
    }

    const dayCompleteBtn = $("#dayCompleteBtn");
    if(dayCompleteBtn){
      dayCompleteBtn.addEventListener("click", () => {
        if(session.dayLocked){
          if(!confirm("Unlock this day and re-enable inputs?")) return;
          session.dayLocked = false;
        }else{
          session.dayLocked = true;
          session.completed = true;
          stopRestTimer();
          stopWorkoutTimer();
          persistTimers();
          hideRestPopup();
        }
        save(state);
        render();
      });
    }

    renderTabs();
    updateTimersUI();
    wireTimers();
    applyDayLock(app, session.dayLocked);
    if(timers.rest.running){
      showRestPopup();
    }else{
      hideRestPopup();
    }

    const weekSelect = $("#weekSelect");
    if(weekSelect){
      weekSelect.onchange = () => {
        state.viewWeekStart = weekSelect.value;
        save(state);
        render();
      };
    }
  }

  // Export / Reset
  $("#exportBtn").onclick = () => {
    // Export only workout set data for the current week (all 5 days).
    ensureWeek();
    save(state);
    const wk = state.weekStart;
    const sessions = state.sessions[wk] || {};
    const exportSessions = {};
    PLAN.forEach(d => {
      const s = sessions[d.id] || {};
      exportSessions[d.id] = { liftSets: s.liftSets || {} };
    });
    const data = JSON.stringify({weekStart: wk, sessions: exportSessions});
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `workout-tracker-export-${isoDate()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  };

  $("#importBtn").onclick = () => {
    $("#importFile").click();
  };

  $("#importFile").onchange = (e) => {
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = (ev) => {
      try{
        const json = JSON.parse(ev.target.result);
        if(!json.weekStart || !json.sessions) throw new Error("Invalid format");
        if(!confirm("This will overwrite your current data. Continue?")) return;
        localStorage.setItem(KEY, JSON.stringify(json));
        location.reload();
      }catch(err){
        alert("Error importing file: " + err.message);
      }
    };
    r.readAsText(f);
  };

  $("#themeToggle").onclick = () => {
    state.theme = state.theme === "light" ? "dark" : "light";
    if(state.theme === "light") document.body.classList.add("light");
    else document.body.classList.remove("light");
    save(state);
  };

  const menuToggle = $("#menuToggle");
  const menuPopup = $("#menuPopup");
  const menuOverlay = $("#menuOverlay");
  if(menuToggle){
    menuToggle.onclick = () => {
      menuPopup.classList.toggle("show");
      menuOverlay.classList.toggle("show");
    };
    menuOverlay.onclick = () => {
      menuPopup.classList.remove("show");
      menuOverlay.classList.remove("show");
    };
    // Close menu when clicking an item
    menuPopup.querySelectorAll(".menuItem").forEach(b => b.addEventListener("click", () => menuOverlay.click()));
  }

  // Developer comments (local only)
  const DEV_NOTES_KEY = `${KEY}__dev_notes`;
  function loadDevNotes(){
    try{ return JSON.parse(localStorage.getItem(DEV_NOTES_KEY)) || []; }catch(e){ return []; }
  }
  function saveDevNotes(notes){
    localStorage.setItem(DEV_NOTES_KEY, JSON.stringify(notes));
  }
  function renderDevNotesList(){
    const list = $("#devNotesList");
    if(!list) return;
    const notes = loadDevNotes();
    list.innerHTML = "";
    if(!notes.length){
      const empty = document.createElement("div");
      empty.className = "small";
      empty.textContent = "No comments yet.";
      list.appendChild(empty);
      return;
    }
    notes.forEach(note => {
      const row = document.createElement("div");
      row.className = "devNoteRow";
      row.innerHTML = `
        <div class="devNoteText">${escapeHtml(note.text)}</div>
        <button class="btn bad" type="button" data-note-id="${note.id}">${ICONS.trash}<span class="label">Delete</span></button>
      `;
      list.appendChild(row);
    });
    list.querySelectorAll("button[data-note-id]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-note-id");
        const next = loadDevNotes().filter(n => n.id !== id);
        saveDevNotes(next);
        renderDevNotesList();
      });
    });
  }
  function openDevNotes(){
    const modal = $("#devNotesModal");
    const overlay = $("#devNotesOverlay");
    if(!modal || !overlay) return;
    renderDevNotesList();
    modal.classList.remove("hidden");
    overlay.classList.remove("hidden");
    const input = $("#devNotesInput");
    if(input) input.focus();
  }
  function closeDevNotes(){
    const modal = $("#devNotesModal");
    const overlay = $("#devNotesOverlay");
    if(modal) modal.classList.add("hidden");
    if(overlay) overlay.classList.add("hidden");
  }
  const devNotesBtn = $("#devNotesBtn");
  if(devNotesBtn) devNotesBtn.onclick = openDevNotes;
  const devNotesClose = $("#devNotesClose");
  if(devNotesClose) devNotesClose.onclick = closeDevNotes;
  const devNotesOverlay = $("#devNotesOverlay");
  if(devNotesOverlay) devNotesOverlay.onclick = closeDevNotes;
  const devNotesAdd = $("#devNotesAdd");
  if(devNotesAdd){
    devNotesAdd.onclick = () => {
      const input = $("#devNotesInput");
      if(!input) return;
      const text = input.value.trim();
      if(!text) return;
      const notes = loadDevNotes();
      notes.push({id:`n_${Date.now()}_${Math.random().toString(36).slice(2,6)}`, text});
      saveDevNotes(notes);
      input.value = "";
      renderDevNotesList();
      input.focus();
    };
  }

  $("#resetBtn").onclick = () => {
    if(!confirm("Reset all saved data on this device?")) return;
    localStorage.removeItem(KEY);
    state = defaultState();
    save(state);
    render();
  };

  $("#dashboardBtn").onclick = () => {
    state.activeDayId = "dashboard";
    save(state);
    render();
  };

  // Init
  ensureWeek();
  save(state);
  scheduleWeeklyRollover();
  render();

})();
</script>
</body>
</html>
